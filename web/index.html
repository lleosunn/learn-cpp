<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnCPP</title>
<link rel="stylesheet" href="/web/vendor/codemirror.min.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<svg style="display:none">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2M8.5 2h7M7 16h10"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></symbol>
</svg>

<header id="navbar">
  <span class="brand">LearnC++</span>
  <button id="list-btn" class="nav-btn"><svg class="i"><use href="#i-list"/></svg>Problem List</button>
  <button id="prev-btn" class="nav-btn icon" title="Previous problem"><svg class="i"><use href="#i-left"/></svg></button>
  <button id="next-btn" class="nav-btn icon" title="Next problem"><svg class="i"><use href="#i-right"/></svg></button>
  <span class="spacer"></span>
  <span id="save-state" class="muted small"></span>
  <div class="progress" title="Problems solved"><span id="progress-text">0 / 0</span><div class="bar"><div id="progress-fill"></div></div></div>
  <button id="nav-playground" class="nav-btn"><svg class="i"><use href="#i-terminal"/></svg>Playground</button>
</header>

<div id="backdrop"></div>
<aside id="sidebar">
  <div class="drawer-head"><span>Problem List</span><button id="list-close" class="nav-btn icon" title="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <nav id="nav"></nav>
</aside>

<main id="main">
  <section id="left" class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="problem" class="active"><svg class="i"><use href="#i-file"/></svg>Question</button>
      <button data-tab="solution"><svg class="i"><use href="#i-bulb"/></svg>Solution</button>
      <button data-tab="tests"><svg class="i"><use href="#i-flask"/></svg>Tests</button>
    </div>
    <div id="tab-problem" class="tab-pane">
      <h1 id="q-title"></h1>
      <div id="q-pills" class="pills"></div>
      <div id="q-body" class="markdown"></div>
      <div id="hints-list"></div>
    </div>
    <div id="tab-solution" class="tab-pane hidden">
      <p class="muted">Reference solution. Try the hints first; reading the answer teaches less than struggling for ten more minutes.</p>
      <button id="solution-btn" class="btn run">Show solution</button>
      <div id="solution-view" class="code-view hidden"></div>
    </div>
    <div id="tab-tests" class="tab-pane hidden">
      <p class="muted">This is the file that calls your code. It is compiled together with your <code>solution.cpp</code>.</p>
      <div id="tests-view" class="code-view"></div>
    </div>
  </section>

  <div id="dragger" class="dragger"></div>

  <section id="right" class="panel">
    <div class="editor-toolbar">
      <span class="lang">C++</span>
      <span class="spacer"></span>
      <button id="reset" class="nav-btn icon" title="Reset to the starter code"><svg class="i"><use href="#i-reset"/></svg></button>
    </div>
    <div id="editor-wrap"><textarea id="editor"></textarea></div>
    <div id="vdragger" class="dragger v"></div>
    <div id="console">
      <div class="tabs"><button class="active">Output</button></div>
      <div id="results"></div>
    </div>
    <div class="submit-toolbar">
      <button id="console-toggle" class="btn run">Console <svg class="i"><use href="#i-up"/></svg></button>
      <button id="run" class="btn submit" title="⌘↵"></button>
    </div>
  </section>
</main>

<script src="/web/vendor/codemirror.min.js"></script>
<script src="/web/vendor/clike.min.js"></script>
<script src="/web/vendor/python.min.js"></script>
<script src="/web/vendor/matchbrackets.min.js"></script>
<script src="/web/vendor/closebrackets.min.js"></script>
<script src="/web/vendor/runmode.min.js"></script>
<script src="/web/vendor/marked.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
